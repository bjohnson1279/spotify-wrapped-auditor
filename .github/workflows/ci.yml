name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-benchmark:
    name: Build & Verify Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Merge Conflict Markers
        run: |
          echo "=== Checking for unresolved merge conflict markers ==="
          CONFLICTS=$(git grep -I -E '^[<]{7}( .*|$)|^[=]{7}$|^[>]{7}( .*|$)' || true)
          if [ -n "$CONFLICTS" ]; then
            echo "❌ Unresolved merge conflict markers detected:"
            echo "$CONFLICTS"
            exit 1
          fi
          echo "✓ No merge conflict markers found."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run verification benchmark
        run: node benchmark_full.cjs
